apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@192.168.119.166:dev/mysql-operator-gitops.git
    targetRevision: develop
    path: operator/mysql-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: mysql-operator-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
