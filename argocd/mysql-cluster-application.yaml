apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql-cluster-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@192.168.119.166:dev/mysql-operator-gitops.git
    targetRevision: develop
    path: instances/mysql-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: mysql-lab
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
