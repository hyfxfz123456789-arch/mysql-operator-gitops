apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: mysqlclusters.apps.egonlin.com
spec:
  group: apps.egonlin.com
  names:
    kind: MysqlCluster
    listKind: MysqlClusterList
    plural: mysqlclusters
    singular: mysqlcluster
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              backup:
                properties:
                  enabled:
                    type: boolean
                  schedule:
                    type: string
                  storage:
                    properties:
                      size:
                        type: string
                      storageClassName:
                        type: string
                    required:
                    - size
                    - storageClassName
                    type: object
                  timeZone:
                    type: string
                type: object
              image:
                description: |-
                  MasterConfig  string `json:"masterConfig"`
                  SlaveConfig   string `json:"slaveConfig"`
                type: string
              masterService:
                type: string
              replicas:
                format: int32
                type: integer
              resources:
                description: 资源要求定义
                properties:
                  limits:
                    description: 资源限制定义
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    required:
                    - cpu
                    - memory
                    type: object
                  requests:
                    description: |-
                      子结构体：用于资源限制
                      资源请求定义
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - limits
                - requests
                type: object
              slaveService:
                type: string
              storage:
                description: |-
                  1、定制CRD必须要有的字段：CR文件中引用的字段是json后的字段
                  子结构体：用于定制存储
                properties:
                  size:
                    type: string
                  storageClassName:
                    type: string
                required:
                - size
                - storageClassName
                type: object
            required:
            - image
            - masterService
            - replicas
            - resources
            - slaveService
            - storage
            type: object
          status:
            description: 2、定制status信息
            properties:
              backup:
                properties:
                  lastJob:
                    type: string
                  lastSuccessTime:
                    type: string
                  phase:
                    type: string
                type: object
              master:
                type: string
              slaves:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
