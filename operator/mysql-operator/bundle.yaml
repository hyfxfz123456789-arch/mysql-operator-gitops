apiVersion: v1
kind: Service
metadata:
  annotations:
    mysql-operator.lab/bundle-render-check: "2026-11-07"
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: mysql-operator
    control-plane: controller-manager
  name: controller-manager-metrics-service
  namespace: mysql-operator-system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: mysql-operator
    control-plane: controller-manager
  name: controller-manager
  namespace: mysql-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: LAB_AUTO_FAILOVER
          value: "true"
        image: crpi-g5ad06a0z4okpo04.cn-shanghai.personal.cr.aliyuncs.com/hyf-test/mysql-operator:lab-auto-failover-fix-20261029-2010
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
